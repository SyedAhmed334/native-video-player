name: native_video_player
description: A high-performance native video player for Flutter with multi-instance support, HLS/DASH streaming, quality switching, and more.
version: 1.0.0
homepage: https://github.com/yourusername/native_video_player
repository: https://github.com/yourusername/native_video_player
issue_tracker: https://github.com/yourusername/native_video_player/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_video_player
        pluginClass: NativeVideoPlayerPlugin
      ios:
        pluginClass: NativeVideoPlayerPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
